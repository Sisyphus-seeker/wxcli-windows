[package]
name = "wx-decrypt"
version.workspace = true
edition.workspace = true

[dependencies]
aes = "0.9"
cbc = "0.2"
pbkdf2 = { version = "0.13", features = ["sha2"] }
# HMAC 0.13 and PBKDF2 0.13 share digest 0.11.
sha2_hmac = { package = "sha2", version = "0.11" }
hmac = "0.13"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
