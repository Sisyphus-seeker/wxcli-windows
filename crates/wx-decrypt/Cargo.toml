[package]
name = "wx-decrypt"
version.workspace = true
edition.workspace = true

[dependencies]
aes = "0.9"
cbc = "0.2"
pbkdf2 = { version = "0.12", features = ["sha2"] }
sha2 = "0.10"
# HMAC 0.13 uses digest 0.11; PBKDF2 0.12 retains sha2 0.10.
sha2_hmac = { package = "sha2", version = "0.11" }
hmac = "0.13"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
